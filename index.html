<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Joe Waldrop — Waldropolis</title>
  <meta name="description" content="Joe Waldrop — project manager in Nashville working across healthcare revenue cycle, AI initiatives and enterprise systems. Explore the portfolio as a neon city built on a computer chip.">
  <meta name="theme-color" content="#070611">
  <meta property="og:title" content="Joe Waldrop — Waldropolis">
  <meta property="og:description" content="A portfolio built as a city on a computer chip: technology, data and product.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css?v=25">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<canvas id="city" aria-hidden="true"></canvas>
<div class="labels" id="labels" aria-label="Buildings in the city"></div>
<div class="tooltip" id="tooltip" hidden aria-hidden="true">
  <span class="tt-key">⏎ Enter</span> <strong data-tt-name></strong>
  <span class="tt-sub" data-tt-sub></span>
</div>

<button type="button" class="prompt" id="prompt" hidden>
  <span class="tt-key">⏎ Enter</span> <strong data-p-name></strong>
  <span class="tt-sub" data-p-sub></span>
</button>

<header class="nav" id="nav">
  <a class="brand" href="#/" aria-label="Joe Waldrop, back to the city">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" fill="currentColor"/></svg>
    <span>JW</span>
  </a>
  <button type="button" class="dir-btn" id="dirOpen" aria-haspopup="dialog">Directory</button>
</header>

<main id="main"></main>

<aside class="sheet" id="sheet" aria-labelledby="pageTitle" hidden>
  <div class="sheet-bar">
    <a class="back mono" href="#/">← Back to the city</a>
    <span class="mono sheet-where" id="sheetWhere"></span>
  </div>
  <div class="sheet-body" id="sheetBody" tabindex="-1"></div>
</aside>

<dialog class="directory" id="directory" aria-labelledby="dirTitle">
  <div class="dir-inner">
    <p class="mono dir-title" id="dirTitle">Waldropolis · Directory</p>
    <ul class="dir-list" id="dirList"></ul>
    <button type="button" class="btn ghost" id="dirClose">← Back to the city</button>
  </div>
</dialog>

<dialog class="directory controls" id="controls" aria-labelledby="controlsTitle">
  <div class="dir-inner">
    <p class="mono dir-title" id="controlsTitle">Controls</p>
    <p class="controls-lede">The camera only moves when you move it — except that sending the car somewhere makes the camera follow it until it arrives. Panning or orbiting takes over again.</p>
    <dl class="controls-list" id="controlsBody"></dl>
    <button type="button" class="btn primary" id="controlsClose">Got it</button>
  </div>
</dialog>

<noscript><p class="noscript">This portfolio draws its city with JavaScript. Please enable it to explore.</p></noscript>
<script type="module" src="main.js?v=25"></script>
</body>
</html>
